<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Patrol</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050611;
      --hud: #f9f7d9;
      --ground: #4a4d57;
      --vehicle: #ffb347;
      --wheel: #111;
      --obstacle: #f25f5c;
      --accent: #7bdff2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #11172d 0%, var(--bg) 55%);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }

    .game-shell {
      width: min(960px, 95vw);
      border: 4px solid #1e2749;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      background: #060914;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }

    .help {
      margin: 0;
      padding: 0.7rem;
      color: #dde5ff;
      text-align: center;
      font-size: 0.95rem;
      border-top: 1px solid #182042;
      background: #0b1230;
    }

    .key {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Moon Patrol game"></canvas>
    <p class="help">Press <span class="key">Space</span>/<span class="key">↑</span> to jump • Press <span class="key">R</span> to restart after crash</p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const world = {
      width: canvas.width,
      height: canvas.height,
      gravity: 1650,
      speed: 360,
      groundY: canvas.height - 96,
      score: 0,
      best: 0,
      running: true,
      spawnTimer: 0,
      spawnInterval: 1.15,
      stars: Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height * 0.7),
        size: Math.random() * 1.8 + 0.3,
      })),
      craters: Array.from({ length: 10 }, (_, i) => ({
        x: i * 190 + Math.random() * 100,
        r: 28 + Math.random() * 42,
      })),
      obstacleSeed: 0,
    };

    const rover = {
      x: 180,
      y: world.groundY,
      w: 84,
      h: 42,
      vy: 0,
      jumpForce: 760,
      jumping: false,
      crashTilt: 0,
    };

    const obstacles = [];
    const keys = new Set();

    function reset() {
      world.score = 0;
      world.speed = 360;
      world.running = true;
      world.spawnTimer = 0;
      world.spawnInterval = 1.1;
      rover.y = world.groundY;
      rover.vy = 0;
      rover.jumping = false;
      rover.crashTilt = 0;
      obstacles.length = 0;
    }

    function spawnObstacle() {
      world.obstacleSeed += 1;
      const tall = Math.random() < 0.35;
      const w = tall ? 48 : 56 + Math.random() * 26;
      const h = tall ? 94 : 38 + Math.random() * 36;
      obstacles.push({
        x: world.width + 50,
        y: world.groundY - h,
        w,
        h,
        pulse: world.obstacleSeed,
      });
    }

    function jump() {
      if (!world.running) {
        return;
      }
      if (!rover.jumping) {
        rover.vy = -rover.jumpForce;
        rover.jumping = true;
      }
    }

    function crash() {
      world.running = false;
      world.best = Math.max(world.best, Math.floor(world.score));
    }

    function update(dt) {
      if (!world.running) {
        rover.crashTilt = Math.min(rover.crashTilt + dt * 2.5, 0.9);
        return;
      }

      world.score += dt * 12;
      world.speed += dt * 4.5;
      world.spawnTimer += dt;

      const difficulty = Math.min(world.score / 180, 0.7);
      if (world.spawnTimer >= world.spawnInterval - difficulty) {
        world.spawnTimer = 0;
        spawnObstacle();
      }

      rover.vy += world.gravity * dt;
      rover.y += rover.vy * dt;

      if (rover.y >= world.groundY) {
        rover.y = world.groundY;
        rover.vy = 0;
        rover.jumping = false;
      }

      for (const crater of world.craters) {
        crater.x -= world.speed * dt * 0.35;
        if (crater.x + crater.r < 0) {
          crater.x = world.width + Math.random() * 160;
          crater.r = 24 + Math.random() * 48;
        }
      }

      for (const obstacle of obstacles) {
        obstacle.x -= world.speed * dt;
      }

      while (obstacles.length > 0 && obstacles[0].x + obstacles[0].w < -10) {
        obstacles.shift();
      }

      const roverBox = {
        x: rover.x + 10,
        y: rover.y - rover.h + 8,
        w: rover.w - 20,
        h: rover.h - 6,
      };

      for (const obstacle of obstacles) {
        if (
          roverBox.x < obstacle.x + obstacle.w &&
          roverBox.x + roverBox.w > obstacle.x &&
          roverBox.y < obstacle.y + obstacle.h &&
          roverBox.y + roverBox.h > obstacle.y
        ) {
          crash();
          break;
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, world.height);
      gradient.addColorStop(0, "#090d22");
      gradient.addColorStop(1, "#070b16");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      ctx.fillStyle = "#f5f7ff";
      ctx.beginPath();
      ctx.arc(760, 90, 48, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0b1230";
      ctx.beginPath();
      ctx.arc(774, 92, 46, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.85)";
      for (const star of world.stars) {
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
    }

    function drawGround() {
      ctx.fillStyle = "#2f3340";
      ctx.fillRect(0, world.groundY, world.width, world.height - world.groundY);

      ctx.fillStyle = "#464b59";
      for (const crater of world.craters) {
        ctx.beginPath();
        ctx.ellipse(crater.x, world.groundY + 20, crater.r, crater.r * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = "#7f858f";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, world.groundY + 2);
      ctx.lineTo(world.width, world.groundY + 2);
      ctx.stroke();
    }

    function drawObstacles(time) {
      for (const obstacle of obstacles) {
        const glow = Math.sin(time * 0.007 + obstacle.pulse) * 0.2 + 0.8;
        ctx.fillStyle = `rgba(242,95,92,${glow})`;
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);

        ctx.fillStyle = "#ffcabf";
        ctx.fillRect(obstacle.x + 7, obstacle.y + 8, obstacle.w - 14, 8);
      }
    }

    function drawRover(time) {
      ctx.save();
      ctx.translate(rover.x + rover.w * 0.5, rover.y - rover.h * 0.5);
      ctx.rotate(world.running ? Math.sin(time * 0.013) * 0.02 : rover.crashTilt);
      ctx.translate(-rover.w * 0.5, -rover.h * 0.5);

      ctx.fillStyle = "#ffa94d";
      ctx.fillRect(0, 5, rover.w, rover.h - 5);

      ctx.fillStyle = "#ffe2b8";
      ctx.fillRect(12, 0, 44, 15);

      ctx.fillStyle = "#1f2937";
      ctx.fillRect(22, 4, 22, 9);

      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(18, rover.h, 12, 0, Math.PI * 2);
      ctx.arc(rover.w - 18, rover.h, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#a1a1aa";
      ctx.beginPath();
      ctx.arc(18, rover.h, 5, 0, Math.PI * 2);
      ctx.arc(rover.w - 18, rover.h, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = "rgba(6, 10, 24, 0.8)";
      ctx.fillRect(16, 14, 300, 74);
      ctx.strokeStyle = "#2c3c77";
      ctx.strokeRect(16, 14, 300, 74);

      ctx.fillStyle = "#f9f7d9";
      ctx.font = "bold 30px Trebuchet MS";
      ctx.fillText(`Score: ${Math.floor(world.score)}`, 30, 47);
      ctx.font = "bold 20px Trebuchet MS";
      ctx.fillText(`Best: ${world.best}`, 32, 76);

      if (!world.running) {
        ctx.fillStyle = "rgba(1, 5, 19, 0.88)";
        ctx.fillRect(world.width / 2 - 220, world.height / 2 - 90, 440, 180);
        ctx.strokeStyle = "#8fa6ff";
        ctx.strokeRect(world.width / 2 - 220, world.height / 2 - 90, 440, 180);

        ctx.fillStyle = "#f8d66d";
        ctx.font = "bold 52px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("CRASH!", world.width / 2, world.height / 2 - 18);
        ctx.font = "22px Trebuchet MS";
        ctx.fillStyle = "#f0f5ff";
        ctx.fillText("Press R to Patrol Again", world.width / 2, world.height / 2 + 34);
        ctx.textAlign = "left";
      }
    }

    let last = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;

      update(dt);
      drawBackground();
      drawGround();
      drawObstacles(now);
      drawRover(now);
      drawHud();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (event) => {
      keys.add(event.code);
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
      }
      if (event.code === "KeyR" && !world.running) {
        reset();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
